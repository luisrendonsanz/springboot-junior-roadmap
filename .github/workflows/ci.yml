name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-maven-projects:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Discover and test Maven projects
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t poms < <(find week-* -type f -name pom.xml | sort)

          if [ "${#poms[@]}" -eq 0 ]; then
            echo "No Maven projects found yet. Nothing to test."
            exit 0
          fi

          for pom in "${poms[@]}"; do
            echo "Testing $pom"
            mvn -B -f "$pom" test
          done
